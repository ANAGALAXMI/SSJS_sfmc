<script>
function tg() {
    var sms = document.getElementById('sms');
    var wh  = document.getElementById('wh');
    var phn = document.getElementById('ph');
    
    if (sms.checked || wh.checked) {
        phn.style.display = 'block';
        phn.disabled = false;
    } else {
        phn.style.display = 'none';
        phn.disabled = true;
    }
} 
</script>
